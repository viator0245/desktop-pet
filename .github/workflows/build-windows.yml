name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Tests (Qt offscreen)
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build executable
        run: python tools/build.py --onefile
      - name: Packaged startup smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\SakuragiDesktopPet.exe" -ArgumentList "--smoke-seconds", "2" -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "Packaged startup timed out" }
          if ($p.ExitCode -ne 0) { throw "Packaged startup failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: SakuragiDesktopPet-Windows
          path: |
            dist/SakuragiDesktopPet.exe
            dist/config.json
            dist/assets/
